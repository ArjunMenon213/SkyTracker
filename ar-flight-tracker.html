<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SkyTracker AR - Flight Radar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #000;
            color: #00f0ff;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            user-select: none;
        }

        #video-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        #video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #canvas-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* HUD Panels */
        #hud-top {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(to bottom, rgba(0, 20, 40, 0.8), transparent);
            z-index: 100;
            font-size: 14px;
            line-height: 1.6;
        }

        #hud-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(to top, rgba(0, 20, 40, 0.8), transparent);
            z-index: 100;
            font-size: 13px;
            line-height: 1.5;
        }

        .hud-stat {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            color: #00f0ff;
        }

        .hud-label {
            color: #ffb700;
            font-weight: bold;
        }

        .hud-value {
            color: #00f0ff;
            font-weight: bold;
        }

        #status-bar {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 20, 40, 0.9);
            border: 2px solid #00f0ff;
            padding: 15px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 200;
            min-width: 200px;
            max-height: 200px;
            overflow-y: auto;
        }

        .status-line {
            margin: 5px 0;
            word-break: break-word;
        }

        .status-ok {
            color: #00ff00;
        }

        .status-warning {
            color: #ffb700;
        }

        .status-error {
            color: #ff3333;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 20, 40, 0.9);
            border: 2px solid #00f0ff;
            padding: 15px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 200;
        }

        .control-row {
            margin: 8px 0;
        }

        #permission-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            text-align: center;
        }

        #permission-content {
            background: rgba(0, 20, 40, 0.95);
            border: 2px solid #00f0ff;
            padding: 40px;
            border-radius: 10px;
            max-width: 500px;
        }

        #permission-content h1 {
            color: #ffb700;
            margin-bottom: 20px;
            font-size: 28px;
        }

        #permission-content p {
            color: #00f0ff;
            margin: 15px 0;
            font-size: 16px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: #00f0ff;
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        button:hover {
            background: #ffb700;
        }

        button:active {
            transform: scale(0.95);
        }

        .hidden {
            display: none !important;
        }

        #debug-log {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 20, 40, 0.9);
            border: 1px solid #00f0ff;
            padding: 10px;
            border-radius: 5px;
            font-size: 10px;
            max-width: 300px;
            max-height: 150px;
            overflow-y: auto;
            z-index: 50;
        }

        .debug-msg {
            color: #00f0ff;
            margin: 2px 0;
        }

        .debug-error {
            color: #ff3333;
        }

        .debug-success {
            color: #00ff00;
        }

        /* Flight info popups - absolutely positioned on canvas */
        .flight-popup {
            position: absolute;
            background: rgba(0, 20, 40, 0.95);
            border: 2px solid #00f0ff;
            border-radius: 5px;
            padding: 10px;
            font-size: 11px;
            white-space: nowrap;
            z-index: 150;
            pointer-events: none;
            min-width: 140px;
        }

        .flight-popup.selected {
            border-color: #ffb700;
            background: rgba(0, 20, 40, 0.99);
            box-shadow: 0 0 20px rgba(255, 183, 0, 0.5);
        }

        .popup-title {
            font-weight: bold;
            color: #ffb700;
            margin-bottom: 5px;
            font-size: 12px;
        }

        .popup-line {
            color: #00f0ff;
            margin: 3px 0;
        }

        .popup-line .label {
            color: #00f0ff;
            display: inline-block;
            width: 40px;
        }

        .popup-line .value {
            color: #ffb700;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Permission Request Overlay -->
    <div id="permission-overlay">
        <div id="permission-content">
            <h1>SKYTRACKER AR</h1>
            <p>Flight Radar with Augmented Reality</p>
            <hr style="border-color: #00f0ff; margin: 20px 0;">
            <p style="margin-top: 30px;">This app requires:</p>
            <ul style="text-align: left; color: #00f0ff; margin: 20px 0;">
                <li>📷 Camera access</li>
                <li>📍 GPS location</li>
                <li>🧭 Compass & Gyroscope</li>
            </ul>
            <div class="button-group">
                <button onclick="startApp()">START AR</button>
                <button onclick="startAppDebug()">DEBUG MODE</button>
            </div>
        </div>
    </div>

    <!-- Debug Log -->
    <div id="debug-log"></div>

    <!-- Video Container -->
    <div id="video-container">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas-overlay"></canvas>

        <!-- Flight popups will be inserted here dynamically -->
        <div id="popups-container"></div>

        <!-- Top HUD Panel -->
        <div id="hud-top">
            <div class="hud-stat">
                <span class="hud-label">LOCATION</span>
                <span class="hud-value" id="gps-coords">--°, --°</span>
            </div>
            <div class="hud-stat">
                <span class="hud-label">HEADING</span>
                <span class="hud-value" id="heading-val">--°</span>
            </div>
            <div class="hud-stat">
                <span class="hud-label">PITCH</span>
                <span class="hud-value" id="pitch-val">--°</span>
            </div>
            <div class="hud-stat">
                <span class="hud-label">AIRCRAFT DETECTED</span>
                <span class="hud-value" id="aircraft-count">0</span>
            </div>
        </div>

        <!-- Controls -->
        <div id="controls">
            <div class="control-row"><span class="hud-label">RANGE</span></div>
            <div class="control-row">
                <span id="range-display">50mi</span>
                <button onclick="adjustRange(-10)">-</button>
                <button onclick="adjustRange(10)">+</button>
            </div>
            <div class="control-row" style="margin-top: 15px;">
                <button onclick="toggleMode()" style="width: 100%;">TOGGLE MAP</button>
            </div>
        </div>

        <!-- Status Bar -->
        <div id="status-bar">
            <div class="status-line">
                <span class="hud-label">STATUS</span>
            </div>
            <div class="status-line" id="gps-status"><span class="status-warning">GPS: Initializing</span></div>
            <div class="status-line" id="camera-status"><span class="status-warning">CAM: Initializing</span></div>
            <div class="status-line" id="sensor-status"><span class="status-warning">SENSOR: Initializing</span></div>
            <div class="status-line" id="api-status"><span class="status-warning">API: Idle</span></div>
        </div>

        <!-- Bottom HUD Panel -->
        <div id="hud-bottom">
            <div id="selected-flight-info"></div>
        </div>
    </div>

    <script>
        // ==================== DEBUG MODE ====================
        const debugMode = new URLSearchParams(window.location.search).has('debug');
        
        function debugLog(message, type = 'msg') {
            const logEl = document.getElementById('debug-log');
            const msgEl = document.createElement('div');
            msgEl.className = `debug-${type}`;
            msgEl.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logEl.appendChild(msgEl);
            logEl.scrollTop = logEl.scrollHeight;
            if (logEl.children.length > 20) {
                logEl.removeChild(logEl.firstChild);
            }
            if (debugMode) console.log(message);
        }

        function startAppDebug() {
            debugLog('Debug mode enabled', 'success');
            startApp();
        }

        // ==================== STATE MANAGEMENT ====================
        const state = {
            userLat: null,
            userLon: null,
            userAlt: 0,
            heading: 0,
            pitch: 0,
            roll: 0,
            aircraftInView: [],
            selectedAircraft: null,
            rangeMax: 50,     // Increased from 15 to show more aircraft
            mapMode: false,
            sensorReady: false,
            apiSource: 'opensky',
            cameraActive: false
        };

        // ==================== DOM ELEMENTS ====================
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas-overlay');
        const ctx = canvas.getContext('2d');
        const permissionOverlay = document.getElementById('permission-overlay');
        const popupsContainer = document.getElementById('popups-container');

        // ==================== CANVAS SETUP ====================
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ==================== PERMISSION & INITIALIZATION ====================
        async function startApp() {
            permissionOverlay.classList.add('hidden');
            debugLog('App started', 'success');
            
            try {
                await requestCamera();
                state.cameraActive = true;
                updateStatus('camera-status', 'CAM: Active', 'ok');
                debugLog('Camera initialized', 'success');
            } catch (e) {
                updateStatus('camera-status', 'CAM: Failed', 'error');
                debugLog(`Camera error: ${e.message}`, 'error');
            }

            requestGPS();
            requestDeviceOrientation();

            renderLoop();

            // Fetch flight data with retry logic
            fetchFlightData();
            setInterval(fetchFlightData, 15000);
        }

        // ==================== CAMERA ACCESS ====================
        async function requestCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: window.innerWidth },
                        height: { ideal: window.innerHeight }
                    }
                });
                video.srcObject = stream;
                return new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        video.play();
                        resolve();
                    };
                });
            } catch (error) {
                debugLog(`Camera error: ${error.message}`, 'error');
                throw error;
            }
        }

        // ==================== GPS TRACKING ====================
        function requestGPS() {
            if (!navigator.geolocation) {
                updateStatus('gps-status', 'GPS: Unavailable', 'error');
                debugLog('Geolocation not supported', 'error');
                return;
            }

            navigator.geolocation.watchPosition(
                (position) => {
                    state.userLat = position.coords.latitude;
                    state.userLon = position.coords.longitude;
                    state.userAlt = position.coords.altitude || 0;
                    
                    document.getElementById('gps-coords').textContent = 
                        `${state.userLat.toFixed(4)}°, ${state.userLon.toFixed(4)}°`;
                    
                    updateStatus('gps-status', `GPS: Lock`, 'ok');
                    debugLog(`GPS: ${state.userLat.toFixed(6)}, ${state.userLon.toFixed(6)}`, 'success');
                },
                (error) => {
                    updateStatus('gps-status', `GPS: ${error.message}`, 'error');
                    debugLog(`GPS error: ${error.message}`, 'error');
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        // ==================== DEVICE ORIENTATION ====================
        async function requestDeviceOrientation() {
            try {
                if (typeof DeviceOrientationEvent !== 'undefined' && 
                    typeof DeviceOrientationEvent.requestPermission === 'function') {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission !== 'granted') {
                        updateStatus('sensor-status', 'SENSOR: Permission denied', 'error');
                        debugLog('Sensor permission denied', 'error');
                        return;
                    }
                }

                window.addEventListener('deviceorientation', handleOrientation);
                state.sensorReady = true;
                updateStatus('sensor-status', 'SENSOR: Active', 'ok');
                debugLog('Device orientation active', 'success');
            } catch (error) {
                debugLog(`Sensor error: ${error.message}`, 'error');
                updateStatus('sensor-status', 'SENSOR: Failed', 'error');
            }
        }

        function handleOrientation(event) {
            if (event.webkitCompassHeading !== undefined) {
                state.heading = event.webkitCompassHeading;
            } else if (event.alpha !== null) {
                state.heading = (360 - event.alpha) % 360;
            }
            
            state.pitch = event.beta || 0;
            state.roll = event.gamma || 0;

            document.getElementById('heading-val').textContent = Math.round(state.heading) + '°';
            document.getElementById('pitch-val').textContent = Math.round(state.pitch) + '°';
        }

        // ==================== FLIGHT DATA FETCHING ====================
        async function fetchFlightData() {
            if (!state.userLat || !state.userLon) {
                debugLog('GPS not locked, skipping API call', 'warning');
                return;
            }

            updateStatus('api-status', 'API: Fetching...', 'warning');
            debugLog('Fetching flight data...', 'msg');

            try {
                const degreeDelta = (state.rangeMax / 2) / 69;
                
                // Try multiple endpoints with CORS proxies
                const endpoints = [
                    {
                        url: `https://cors-anywhere.herokuapp.com/https://opensky-network.org/api/states/all?lamin=${state.userLat - degreeDelta}&lomin=${state.userLon - degreeDelta}&lamax=${state.userLat + degreeDelta}&lomax=${state.userLon + degreeDelta}`,
                        name: 'OpenSky (CORS)',
                        parser: parseOpenSkyAPI
                    },
                    {
                        url: `https://opensky-network.org/api/states/all?lamin=${state.userLat - degreeDelta}&lomin=${state.userLon - degreeDelta}&lamax=${state.userLat + degreeDelta}&lomax=${state.userLon + degreeDelta}`,
                        name: 'OpenSky (Direct)',
                        parser: parseOpenSkyAPI
                    },
                    {
                        url: `https://api.adsbexchange.com/v2/lat/${state.userLat}/lon/${state.userLon}/dist/${state.rangeMax}`,
                        name: 'ADSBExchange',
                        parser: parseADSBExchangeAPI
                    }
                ];

                let success = false;
                for (const endpoint of endpoints) {
                    try {
                        debugLog(`Trying ${endpoint.name}...`, 'msg');
                        const response = await fetch(endpoint.url, {
                            mode: 'cors',
                            timeout: 8000
                        });
                        
                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}`);
                        }

                        const data = await response.json();
                        const aircraft = endpoint.parser(data);
                        
                        if (aircraft && aircraft.length > 0) {
                            state.aircraftInView = aircraft;
                            document.getElementById('aircraft-count').textContent = aircraft.length;
                            updateStatus('api-status', `API: ${aircraft.length} targets (${endpoint.name})`, 'ok');
                            debugLog(`Success! Found ${aircraft.length} aircraft via ${endpoint.name}`, 'success');
                            success = true;
                            state.apiSource = endpoint.name;
                            break;
                        }
                    } catch (error) {
                        debugLog(`${endpoint.name} failed: ${error.message}`, 'error');
                    }
                }

                if (!success) {
                    state.aircraftInView = generateMockData();
                    document.getElementById('aircraft-count').textContent = state.aircraftInView.length;
                    updateStatus('api-status', `API: ${state.aircraftInView.length} targets (MOCK)`, 'warning');
                    debugLog(`All endpoints failed, using mock data`, 'warning');
                }

            } catch (error) {
                debugLog(`API fetch error: ${error.message}`, 'error');
                updateStatus('api-status', 'API: Error', 'error');
                state.aircraftInView = generateMockData();
            }
        }

        // ==================== API PARSERS ====================
        function parseOpenSkyAPI(data) {
            if (!data.states) return [];
            
            return data.states
                .map(flight => ({
                    icao24: flight[0],
                    callsign: (flight[1] || '').trim() || 'UNK',
                    country: flight[2] || 'Unknown',
                    lon: flight[5],
                    lat: flight[6],
                    altitude: flight[7] ? Math.round(flight[7] * 3.28084) : 0,
                    velocity: flight[9] ? (flight[9] * 1.944).toFixed(0) : 0,
                    heading: flight[10] ? Math.round(flight[10]) : 0,
                    verticalRate: flight[11] ? (flight[11] * 196.85).toFixed(0) : 0
                }))
                .filter(f => f.lat && f.lon && f.lat !== null && f.lon !== null)
                .map(f => ({
                    ...f,
                    distance: getDistance(state.userLat, state.userLon, f.lat, f.lon),
                    bearing: getBearing(state.userLat, state.userLon, f.lat, f.lon),
                    elevation: getElevation(state.userAlt, f.altitude)
                }))
                .filter(f => f.distance <= state.rangeMax);
        }

        function parseADSBExchangeAPI(data) {
            if (!data.ac) return [];
            
            return data.ac
                .map(flight => ({
                    icao24: flight.icao,
                    callsign: (flight.call || '').trim() || 'UNK',
                    country: flight.country || 'Unknown',
                    lon: flight.lon,
                    lat: flight.lat,
                    altitude: flight.alt_baro || flight.alt_geom || 0,
                    velocity: flight.gs ? (flight.gs * 1.944).toFixed(0) : 0,
                    heading: flight.track ? Math.round(flight.track) : 0,
                    verticalRate: flight.baro_rate ? (flight.baro_rate * 196.85).toFixed(0) : 0
                }))
                .filter(f => f.lat && f.lon && f.lat !== null && f.lon !== null)
                .map(f => ({
                    ...f,
                    distance: getDistance(state.userLat, state.userLon, f.lat, f.lon),
                    bearing: getBearing(state.userLat, state.userLon, f.lat, f.lon),
                    elevation: getElevation(state.userAlt, f.altitude)
                }))
                .filter(f => f.distance <= state.rangeMax);
        }

        // ==================== MOCK DATA FOR TESTING ====================
        function generateMockData() {
            const mockAircraft = [
                { callsign: 'UAL456', lat: state.userLat + 0.02, lon: state.userLon + 0.01, altitude: 35000, velocity: 450, heading: 180, verticalRate: 1500 },
                { callsign: 'SWA789', lat: state.userLat - 0.015, lon: state.userLon + 0.02, altitude: 28000, velocity: 420, heading: 270, verticalRate: -800 },
                { callsign: 'DAL123', lat: state.userLat + 0.01, lon: state.userLon - 0.015, altitude: 32000, velocity: 480, heading: 90, verticalRate: 2000 },
                { callsign: 'AAL999', lat: state.userLat - 0.025, lon: state.userLon - 0.01, altitude: 38000, velocity: 490, heading: 45, verticalRate: 500 }
            ];

            return mockAircraft.map(f => ({
                ...f,
                icao24: Math.random().toString(16).substr(2, 6),
                country: 'USA',
                distance: getDistance(state.userLat, state.userLon, f.lat, f.lon),
                bearing: getBearing(state.userLat, state.userLon, f.lat, f.lon),
                elevation: getElevation(state.userAlt, f.altitude)
            }));
        }

        // ==================== DISTANCE & BEARING CALCULATIONS ====================
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 3958.8; // miles
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + 
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        function getBearing(lat1, lon1, lat2, lon2) {
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
            const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                      Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        function getElevation(alt1Feet, alt2Feet) {
            const altDiff = (alt2Feet - alt1Feet) / 5280;
            const distance = state.aircraftInView[0]?.distance || 1;
            return Math.atan2(altDiff, distance) * (180 / Math.PI);
        }

        // ==================== RENDERING ENGINE ====================
        function renderLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Update popups for all aircraft
            updateFlightPopups();

            if (state.mapMode) {
                drawMapView();
            } else {
                drawARView();
            }

            requestAnimationFrame(renderLoop);
        }

        function drawARView() {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const cyan = '#00f0ff';
            const gold = '#ffb700';

            // Draw central reticle
            ctx.strokeStyle = cyan;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cx, cy, 30, 0, Math.PI * 2);
            ctx.stroke();

            // Draw crosshairs
            ctx.beginPath();
            ctx.moveTo(cx - 40, cy);
            ctx.lineTo(cx - 20, cy);
            ctx.moveTo(cx + 20, cy);
            ctx.lineTo(cx + 40, cy);
            ctx.moveTo(cx, cy - 40);
            ctx.lineTo(cx, cy - 20);
            ctx.moveTo(cx, cy + 20);
            ctx.lineTo(cx, cy + 40);
            ctx.stroke();

            // Draw altitude circles at different ranges
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.2)';
            ctx.lineWidth = 1;
            const ranges = [50, 100, 150];
            ranges.forEach(range => {
                ctx.beginPath();
                ctx.arc(cx, cy, range, 0, Math.PI * 2);
                ctx.stroke();
            });

            // Draw bearing lines
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.1)';
            for (let bearing = 0; bearing < 360; bearing += 45) {
                const rad = bearing * Math.PI / 180;
                const x = cx + Math.sin(rad) * 150;
                const y = cy - Math.cos(rad) * 150;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(x, y);
                ctx.stroke();
            }

            // Draw aircraft targets (for debugging)
            state.aircraftInView.forEach((aircraft, idx) => {
                const relativeYaw = (aircraft.bearing - state.heading + 360) % 360;
                const relativePitch = aircraft.elevation - state.pitch;

                const screenX = cx + Math.sin((relativeYaw - 180) * Math.PI / 180) * 200;
                const screenY = cy - relativePitch * 15;

                if (screenX > 20 && screenX < canvas.width - 20 && 
                    screenY > 80 && screenY < canvas.height - 80) {
                    
                    const isSelected = state.selectedAircraft === idx;
                    ctx.strokeStyle = isSelected ? gold : cyan;
                    ctx.fillStyle = isSelected ? 'rgba(255, 183, 0, 0.1)' : 'transparent';
                    ctx.lineWidth = isSelected ? 3 : 2;

                    ctx.fillRect(screenX - 15, screenY - 15, 30, 30);
                    ctx.strokeRect(screenX - 15, screenY - 15, 30, 30);

                    aircraft.screenX = screenX;
                    aircraft.screenY = screenY;
                }
            });
        }

        function drawMapView() {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const cyan = '#00f0ff';
            const gold = '#ffb700';

            ctx.fillStyle = 'rgba(0, 20, 40, 0.3)';
            ctx.fillRect(40, 80, canvas.width - 80, canvas.height - 160);
            
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.2)';
            ctx.lineWidth = 1;
            const gridSize = 50;
            for (let x = 40; x < canvas.width - 40; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 80);
                ctx.lineTo(x, canvas.height - 80);
                ctx.stroke();
            }
            for (let y = 80; y < canvas.height - 80; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(40, y);
                ctx.lineTo(canvas.width - 40, y);
                ctx.stroke();
            }

            ctx.fillStyle = gold;
            ctx.beginPath();
            ctx.arc(cx, cy, 8, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = cyan;
            const mapScale = (state.rangeMax / 2) / 100;
            
            state.aircraftInView.forEach((aircraft, idx) => {
                const dx = (aircraft.lon - state.userLon) / mapScale;
                const dy = (aircraft.lat - state.userLat) / mapScale;
                
                const mapX = cx + dx;
                const mapY = cy - dy;

                if (mapX > 40 && mapX < canvas.width - 40 && 
                    mapY > 80 && mapY < canvas.height - 80) {
                    
                    const isSelected = state.selectedAircraft === idx;
                    ctx.fillStyle = isSelected ? gold : cyan;
                    
                    ctx.beginPath();
                    ctx.arc(mapX, mapY, isSelected ? 10 : 6, 0, Math.PI * 2);
                    ctx.fill();

                    aircraft.screenX = mapX;
                    aircraft.screenY = mapY;
                }
            });
        }

        // ==================== FLIGHT POPUPS ====================
        function updateFlightPopups() {
            // Clear old popups
            popupsContainer.innerHTML = '';

            state.aircraftInView.forEach((aircraft, idx) => {
                if (!aircraft.screenX || !aircraft.screenY) return;

                const isSelected = state.selectedAircraft === idx;
                
                const popup = document.createElement('div');
                popup.className = `flight-popup ${isSelected ? 'selected' : ''}`;
                popup.style.left = (aircraft.screenX + 20) + 'px';
                popup.style.top = (aircraft.screenY - 40) + 'px';
                popup.style.cursor = 'pointer';
                popup.id = `popup-${idx}`;

                popup.innerHTML = `
                    <div class="popup-title">${aircraft.callsign}</div>
                    <div class="popup-line"><span class="label">ALT:</span> <span class="value">${aircraft.altitude}ft</span></div>
                    <div class="popup-line"><span class="label">SPD:</span> <span class="value">${aircraft.velocity}kt</span></div>
                    <div class="popup-line"><span class="label">HDG:</span> <span class="value">${aircraft.heading}°</span></div>
                    <div class="popup-line"><span class="label">DIS:</span> <span class="value">${aircraft.distance.toFixed(1)}mi</span></div>
                `;

                popup.addEventListener('click', () => {
                    state.selectedAircraft = state.selectedAircraft === idx ? null : idx;
                });

                popupsContainer.appendChild(popup);
            });
        }

        // ==================== CONTROLS ====================
        function adjustRange(delta) {
            state.rangeMax = Math.max(5, Math.min(200, state.rangeMax + delta));
            document.getElementById('range-display').textContent = state.rangeMax + 'mi';
            fetchFlightData();
        }

        function toggleMode() {
            state.mapMode = !state.mapMode;
        }

        // ==================== UI HELPERS ====================
        function updateStatus(elementId, message, type) {
            const el = document.getElementById(elementId);
            el.innerHTML = `<span class="status-${type}">${message}</span>`;
        }

        // Auto-show debug log on load if debug mode
        if (debugMode) {
            document.getElementById('debug-log').style.display = 'block';
            debugLog('Debug mode initialized', 'success');
        } else {
            document.getElementById('debug-log').style.display = 'none';
        }
    </script>
</body>
</html>
