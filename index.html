<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stark Core Telemetry</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 600px;
            height: 600px;
            background-color: #000000; /* Pure black is transparent on the glasses */
            color: #00f0ff;
            font-family: monospace;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 600px;
            height: 600px;
        }
    </style>
</head>
<body>

    <canvas id="telemetryCanvas" width="600" height="600"></canvas>

    <script>
        const canvas = document.getElementById('telemetryCanvas');
        const ctx = canvas.getContext('2d');

        // Core variables to isolate
        let lat = "ACQUIRING...";
        let lon = "ACQUIRING...";
        let heading = 0;
        let pitch = 0;
        let gpsStatus = "SEARCHING";

        // 1. Core GPS Location Hook
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition((position) => {
                lat = position.coords.latitude.toFixed(6);
                lon = position.coords.longitude.toFixed(6);
                gpsStatus = "LOCKED";
            }, (err) => {
                gpsStatus = `ERROR (${err.code})`;
            }, { 
                enableHighAccuracy: true, 
                timeout: 10000, 
                maximumAge: 0 
            });
        } else {
            gpsStatus = "UNSUPPORTED";
        }

        // 2. Core Orientation (Compass & Tilt) Hooks
        window.addEventListener('deviceorientation', (event) => {
            // Raw alpha handling (Compass/Yaw)
            if (event.alpha !== null) {
                // Adjusting to make 0 North, 90 East, etc.
                heading = Math.round((360 - event.alpha) % 360);
            }
            
            // Raw beta handling (Pitch/Incline)
            if (event.beta !== null) {
                pitch = Math.round(event.beta);
            }
        }, true);

        // 3. Simple Render Loop
        function drawTelemetry() {
            ctx.clearRect(0, 0, 600, 600);

            ctx.fillStyle = '#00f0ff';
            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 2;

            // Draw a basic fixed targeting reticle just to confirm the screen is rendering
            ctx.beginPath();
            ctx.arc(300, 300, 20, 0, Math.PI * 2);
            ctx.moveTo(270, 300); ctx.lineTo(290, 300);
            ctx.moveTo(310, 300); ctx.lineTo(330, 300);
            ctx.stroke();

            // Render Text (Using large 20px font so it's easy to read in the waveguide)
            ctx.font = 'bold 20px monospace';
            
            ctx.fillText(`[ STARK SYSTEMS CORE DATALINK ]`, 50, 80);
            ctx.fillText(`-------------------------------`, 50, 110);
            
            ctx.fillText(`GPS LINK : ${gpsStatus}`, 50, 160);
            ctx.fillText(`LATITUDE : ${lat}`, 50, 200);
            ctx.fillText(`LONGITUDE: ${lon}`, 50, 240);
            
            ctx.fillText(`-------------------------------`, 50, 290);
            
            ctx.fillText(`HEADING  : ${heading}° (YAW)`, 50, 340);
            ctx.fillText(`INCLINE  : ${pitch}° (PITCH)`, 50, 380);

            // Visual feedback: brief indicator at the bottom showing the frame is alive
            ctx.font = '14px monospace';
            ctx.fillText(`SYS_TICK: ${Date.now().toString().slice(-4)}`, 50, 520);

            requestAnimationFrame(drawTelemetry);
        }

        drawTelemetry();
    </script>
</body>
</html>
