<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stark SkyRadar AR</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            width: 600px;
            height: 600px;
            background-color: #000000; /* Pure black = transparent on the glasses */
            color: #00f0ff;
            font-family: monospace;
            overflow: hidden;
            user-select: none;
        }
        canvas {
            display: block;
            width: 600px;
            height: 600px;
        }
    </style>
</head>
<body>

    <canvas id="mrbdCanvas" width="600" height="600"></canvas>

    <script src="app.js"></script>
</body>
</html>
