<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sensor Calibration</title>
    <style>
        body {
            margin: 0; padding: 0; width: 600px; height: 600px;
            background-color: #000000; color: #00f0ff; font-family: monospace;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        #terminal { width: 500px; font-size: 18px; line-height: 1.6; }
        .blink { animation: blinker 1s linear infinite; color: #ffb700; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div id="terminal">
        <h2>STARK HUD SENSOR UTILITY</h2>
        <hr style="border-color: #00f0ff;">
        <p id="gps-status">GPS: LOCK REQUIRED</p>
        <p id="imu-status">IMU: COMPASS CALIBRATION REQUIRED</p>
        <br><br>
        <p class="blink" id="action-prompt">PRESS [ENTER] GESTURE TO ENGAGE HANDSHAKE</p>
    </div>

    <script>
        let calibratedHeading = 0;

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('action-prompt').innerText = "REQUESTING PERMISSIONS...";
                triggerHardwareHandshake();
            }
        });

        async function triggerHardwareHandshake() {
            // 1. FORCED COMPASS/IMU PERMISSION FLOW (Critical for Meta OS integration)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceOrientationEvent.requestPermission();
                    if (permissionState === 'granted') {
                        attachCompassListener();
                    } else {
                        document.getElementById('imu-status').innerText = "IMU: PERMISSION DENIED";
                    }
                } catch (error) {
                    document.getElementById('imu-status').innerText = "IMU: PROMPT FAILED";
                }
            } else {
                // Fallback for runtimes where requestPermission isn't nested as a function
                attachCompassListener();
            }

            // 2. FORCED HIGH-ACCURACY GPS EXTRACTION
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    (pos) => {
                        document.getElementById('gps-status').innerHTML = 
                            `GPS: <span style="color:#00ff55;">LOCKED</span><br>LAT: ${pos.coords.latitude.toFixed(4)} | LON: ${pos.coords.longitude.toFixed(4)}`;
                    },
                    (err) => {
                        document.getElementById('gps-status').innerHTML = `GPS: <span style="color:#ff3333;">ERROR (${err.message})</span>`;
                    },
                    { 
                        enableHighAccuracy: true, // Forces proxy to phone's real GPS sensor instead of IP approximation
                        timeout: 10000, 
                        maximumAge: 0 
                    }
                );
            } else {
                document.getElementById('gps-status').innerText = "GPS: UNSUPPORTED BY METADEVICE";
            }
        }

        function attachCompassListener() {
            window.addEventListener('deviceorientation', (event) => {
                // Use absolute webkit heading if available (maps to true geographic north)
                if (event.webkitCompassHeading !== undefined && event.webkitCompassHeading !== null) {
                    calibratedHeading = event.webkitCompassHeading;
                } else if (event.alpha !== null) {
                    calibratedHeading = 360 - event.alpha; // Invert to align with real-world orientation turning right
                }
                
                document.getElementById('imu-status').innerHTML = 
                    `IMU: <span style="color:#00ff55;">CONNECTED</span><br>HEADING: ${Math.round(calibratedHeading)}°`;
            }, true);
        }
    </script>
</body>
</html>
